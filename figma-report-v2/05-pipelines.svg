<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#10191C"/><text x="86" y="58" fill="#F8F4EA" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="start" letter-spacing="1.5px" opacity="1">MJB / 2026</text><text x="1834" y="58" fill="#A6B5B3" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="end" letter-spacing="1.2px" opacity="1">05  /  PIPELINES</text><line x1="86" y1="82" x2="1834" y2="82" stroke="#40575A" stroke-width="1"/><text x="86" y="160" fill="#F0A48E" font-family="Courier New, monospace" font-size="13px" font-weight="700" text-anchor="start" letter-spacing="1.5px" opacity="1">03 / AUTOMATION + DATA</text><text x="86" y="245" fill="#F8F4EA" font-family="Georgia, Times New Roman, serif" font-size="78px" font-weight="400" text-anchor="start" letter-spacing="-3px" opacity="1">From signal</text><text x="86" y="320" fill="#F0A48E" font-family="Georgia, Times New Roman, serif" font-size="78px" font-weight="400" text-anchor="start" letter-spacing="-3px" opacity="1">to useful output.</text><text x="86" y="410" fill="#A6B5B3" font-family="Arial, Helvetica, sans-serif" font-size="20px" font-weight="400" text-anchor="start" letter-spacing="0.0px" opacity="1">The interesting part is the chain: fetch, normalize, store,</text><text x="86" y="442" fill="#A6B5B3" font-family="Arial, Helvetica, sans-serif" font-size="20px" font-weight="400" text-anchor="start" letter-spacing="0.0px" opacity="1">translate, explain, and send only what the user can inspect.</text><rect x="86" y="550" width="845" height="300" rx="16" fill="#17272A" stroke="#496467" stroke-width="1"/><text x="121" y="602" fill="#D9F36A" font-family="Courier New, monospace" font-size="13px" font-weight="700" text-anchor="start" letter-spacing="1.2px" opacity="1">ARABIC NEWS BOT</text><text x="121" y="655" fill="#F8F4EA" font-family="Georgia, Times New Roman, serif" font-size="30px" font-weight="400" text-anchor="start" letter-spacing="0.0px" opacity="1">RSS  →  Arabic  →  Telegram</text><text x="121" y="710" fill="#A6B5B3" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" text-anchor="start" letter-spacing="0.0px" opacity="1">multi-feed polling</text><text x="121" y="738" fill="#A6B5B3" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" text-anchor="start" letter-spacing="0.0px" opacity="1">SQLite deduplication</text><text x="121" y="766" fill="#A6B5B3" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" text-anchor="start" letter-spacing="0.0px" opacity="1">owner-only commands</text><text x="121" y="794" fill="#A6B5B3" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" text-anchor="start" letter-spacing="0.0px" opacity="1">weekly report + video script</text><rect x="995" y="550" width="835" height="300" rx="16" fill="#2E4B43" stroke="#557174" stroke-width="1"/><text x="1030" y="602" fill="#D9F36A" font-family="Courier New, monospace" font-size="13px" font-weight="700" text-anchor="start" letter-spacing="1.2px" opacity="1">CRYPTO SIGNAL ANALYZER</text><text x="1030" y="655" fill="#F8F4EA" font-family="Georgia, Times New Roman, serif" font-size="30px" font-weight="400" text-anchor="start" letter-spacing="0.0px" opacity="1">Data, with the caveat attached.</text><text x="1030" y="710" fill="#D6E0DD" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" text-anchor="start" letter-spacing="0.0px" opacity="1">CoinGecko market data</text><text x="1030" y="738" fill="#D6E0DD" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" text-anchor="start" letter-spacing="0.0px" opacity="1">volatility + drawdown + rank</text><text x="1030" y="766" fill="#D6E0DD" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" text-anchor="start" letter-spacing="0.0px" opacity="1">7d / 30d momentum</text><text x="1030" y="794" fill="#D6E0DD" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" text-anchor="start" letter-spacing="0.0px" opacity="1">informational, not a promise</text><text x="86" y="935" fill="#F0A48E" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="start" letter-spacing="0.0px" opacity="1">01</text><text x="134" y="935" fill="#A6B5B3" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="start" letter-spacing="0.0px" opacity="1">FETCH</text><line x1="208" y1="930" x2="491" y2="930" stroke="#557174" stroke-width="2"/><text x="521" y="935" fill="#F0A48E" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="start" letter-spacing="0.0px" opacity="1">02</text><text x="569" y="935" fill="#A6B5B3" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="start" letter-spacing="0.0px" opacity="1">NORMALIZE</text><line x1="676" y1="930" x2="966" y2="930" stroke="#557174" stroke-width="2"/><text x="996" y="935" fill="#F0A48E" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="start" letter-spacing="0.0px" opacity="1">03</text><text x="1044" y="935" fill="#A6B5B3" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="start" letter-spacing="0.0px" opacity="1">STORE + EXPLAIN</text><line x1="1211" y1="930" x2="1834" y2="930" stroke="#D9F36A" stroke-width="2"/><line x1="86" y1="1004" x2="1834" y2="1004" stroke="#40575A" stroke-width="1"/><text x="86" y="1041" fill="#A6B5B3" font-family="Courier New, monospace" font-size="11px" font-weight="700" text-anchor="start" letter-spacing="0.8px" opacity="1">PYTHON  ·  RSS / HTTP APIs  ·  SQLITE  ·  TELEGRAM  ·  EXPLAINABLE OUTPUT</text><text x="1834" y="1041" fill="#A6B5B3" font-family="Courier New, monospace" font-size="11px" font-weight="700" text-anchor="end" letter-spacing="0.8px" opacity="1">05 / 08</text></svg>