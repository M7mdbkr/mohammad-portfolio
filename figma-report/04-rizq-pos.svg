0.70 ر.س</text><rect x="345" y="665" width="350" height="38" rx="19" fill="#B75034" stroke="#B75034" stroke-width="1"/><text x="520" y="690" fill="#FFF8F0" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="700" text-anchor="middle" letter-spacing="0px" opacity="1">إتمام الطلب</text><text x="850" y="355" fill="#B75034" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="start" letter-spacing="1.2px" opacity="1">THE PRODUCT STORY</text><text x="850" y="410" fill="#17252B" font-family="Georgia, Times New Roman, serif" font-size="32px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">A real operational surface,</text><text x="850" y="448" fill="#17252B" font-family="Georgia, Times New Roman, serif" font-size="32px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">not just a dashboard mockup.</text><text x="850" y="515" fill="#68767A" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">Separate cashier and owner flows.</text><text x="850" y="549" fill="#68767A" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">Browser-local SQLite/WASM storage.</text><text x="850" y="583" fill="#68767A" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">Receipts, CSV export, inventory, VAT.</text><text x="850" y="617" fill="#68767A" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">RTL layout and Arabic typography.</text><rect x="850" y="680" width="680" height="95" rx="10" fill="#F6E6DF" stroke="#D5A08F" stroke-width="1"/><text x="880" y="715" fill="#B75034" font-family="Courier New, monospace" font-size="11px" font-weight="700" text-anchor="start" letter-spacing="1px" opacity="1">HONEST READINESS NOTE</text><text x="880" y="750" fill="#17252B" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">Build passes; security hardening is required before real customer data.</text><rect x="70" y="825" width="66" height="30" rx="15" fill="#FBFAF6" stroke="#C9C4B8" stroke-width="1"/><text x="103.0" y="845" fill="#176D78" font-family="Courier New, monospace" font-size="11px" font-weight="700" text-anchor="middle" letter-spacing="0.5px" opacity="1">REACT</text><rect x="155" y="825" width="106" height="30" rx="15" fill="#FBFAF6" stroke="#C9C4B8" stroke-width="1"/><text x="208.0" y="845" fill="#176D78" font-family="Courier New, monospace" font-size="11px" font-weight="700" text-anchor="middle" letter-spacing="0.5px" opacity="1">TYPESCRIPT</text><rect x="280" y="825" width="58" height="30" rx="15" fill="#FBFAF6" stroke="#C9C4B8" stroke-width="1"/><text x="309.0" y="845" fill="#176D78" font-family="Courier New, monospace" font-size="11px" font-weight="700" text-anchor="middle" letter-spacing="0.5px" opacity="1">VITE</text><rect x="350" y="825" width="74" height="30" rx="15" fill="#FBFAF6" stroke="#C9C4B8" stroke-width="1"/><text x="387.0" y="845" fill="#176D78" font-family="Courier New, monospace" font-size="11px" font-weight="700" text-anchor="middle" letter-spacing="0.5px" opacity="1">SQL.JS</text><text x="1530" y="850" fill="#B75034" font-family="Courier New, monospace" font-size="16px" font-weight="700" text-anchor="end" letter-spacing="0px" opacity="1">github.com/M7mdbkr/rizq-pos</text><line x1="70" y1="930" x2="1530" y2="930" stroke="#C9C4B8" stroke-width="1"/><text x="70" y="962" fill="#68767A" font-family="Courier New, monospace" font-size="11px" font-weight="700" text-anchor="start" letter-spacing="0.8px" opacity="1">RIZQ POS  ·  RTL  ·  PRODUCT THINKING  ·  DEMO-FIRST</text><text x="1530" y="962" fill="#68767A" font-family="Courier New, monospace" font-size="11px"