<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#17252B"/><text x="70" y="60" fill="#F7F3EA" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="start" letter-spacing="1.5px" opacity="1">MJB / PORTFOLIO REPORT</text><text x="1530" y="60" fill="#AEBDBD" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="end" letter-spacing="1.2px" opacity="1">03  ·  FEATURED CASE</text><line x1="70" y1="82" x2="1530" y2="82" stroke="#496064" stroke-width="1"/><text x="70" y="155" fill="#D99D8B" font-family="Courier New, monospace" font-size="13px" font-weight="700" text-anchor="start" letter-spacing="1.4px" opacity="1">01 / FEATURED CASE</text><text x="70" y="225" fill="#F7F3EA" font-family="Georgia, Times New Roman, serif" font-size="78px" font-weight="400" text-anchor="start" letter-spacing="-2px" opacity="1">AgenticOS</text><text x="70" y="270" fill="#AEBDBD" font-family="Arial, Helvetica, sans-serif" font-size="22px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">A local-first personal agent operating system.</text><text x="70" y="360" fill="#F7F3EA" font-family="Arial, Helvetica, sans-serif" font-size="19px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">Four specialist workspaces, a human-in-the-loop</text><text x="70" y="390" fill="#F7F3EA" font-family="Arial, Helvetica, sans-serif" font-size="19px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">approval layer, Telegram and n8n hooks, local context,</text><text x="70" y="420" fill="#F7F3EA" font-family="Arial, Helvetica, sans-serif" font-size="19px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">schedules, page-agent interactions, and a SHA-256 audit chain.</text><text x="70" y="495" fill="#D99D8B" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="start" letter-spacing="1px" opacity="1">THE ENGINEERING STORY</text><text x="70" y="535" fill="#B75034" font-family="Georgia, Times New Roman, serif" font-size="22px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">—</text><text x="102" y="535" fill="#DCE7E3" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">State is stored locally in SQLite.</text><text x="70" y="574" fill="#B75034" font-family="Georgia, Times New Roman, serif" font-size="22px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">—</text><text x="102" y="574" fill="#DCE7E3" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">External actions become reviewable cards.</text><text x="70" y="613" fill="#B75034" font-family="Georgia, Times New Roman, serif" font-size="22px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">—</text><text x="102" y="613" fill="#DCE7E3" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">Providers are replaceable instead of permanent.</text><text x="70" y="652" fill="#B75034" font-family="Georgia, Times New Roman, serif" font-size="22px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">—</text><text x="102" y="652" fill="#DCE7E3" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">Runtime data stays outside the public snapshot.</text><rect x="850" y="145" width="680" height="600" rx="2" fill="#20353A" stroke="#496064" stroke-width="1"/><text x="900" y="195" fill="#D99D8B" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="start" letter-spacing="1.2px" opacity="1">ARCHITECTURE</text><rect x="900" y="240" width="580" height="75" rx="8" fill="#17252B" 