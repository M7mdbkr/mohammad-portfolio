<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#F4F0E8"/><text x="70" y="60" fill="#17252B" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="start" letter-spacing="1.5px" opacity="1">MJB / PORTFOLIO REPORT</text><text x="1530" y="60" fill="#68767A" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="end" letter-spacing="1.2px" opacity="1">02  ·  THROUGHLINE</text><line x1="70" y1="82" x2="1530" y2="82" stroke="#C9C4B8" stroke-width="1"/><text x="70" y="160" fill="#B75034" font-family="Courier New, monospace" font-size="13px" font-weight="700" text-anchor="start" letter-spacing="1.4px" opacity="1">THE THROUGHLINE</text><text x="70" y="228" fill="#17252B" font-family="Georgia, Times New Roman, serif" font-size="62px" font-weight="400" text-anchor="start" letter-spacing="-2px" opacity="1">Systems that stay</text><text x="70" y="288" fill="#B75034" font-family="Georgia, Times New Roman, serif" font-size="62px" font-weight="400" text-anchor="start" letter-spacing="-2px" opacity="1">understandable.</text><text x="70" y="355" fill="#68767A" font-family="Arial, Helvetica, sans-serif" font-size="20px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">The projects vary in surface area — an operating system,</text><text x="70" y="386" fill="#68767A" font-family="Arial, Helvetica, sans-serif" font-size="20px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">a POS, a news bot, a route planner, a video pipeline —</text><text x="70" y="417" fill="#68767A" font-family="Arial, Helvetica, sans-serif" font-size="20px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">but the engineering instinct stays consistent.</text><line x1="70" y1="482" x2="805" y2="482" stroke="#C9C4B8" stroke-width="1"/><text x="70" y="515" fill="#B75034" font-family="Courier New, monospace" font-size="13px" font-weight="700" text-anchor="start" letter-spacing="1px" opacity="1">01</text><text x="125" y="515" fill="#17252B" font-family="Courier New, monospace" font-size="16px" font-weight="700" text-anchor="start" letter-spacing="0.8px" opacity="1">MAKE STATE VISIBLE</text><text x="125" y="545" fill="#68767A" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">Dashboards, timelines, logs, and clear empty states.</text><line x1="70" y1="574" x2="805" y2="574" stroke="#C9C4B8" stroke-width="1"/><text x="70" y="607" fill="#B75034" font-family="Courier New, monospace" font-size="13px" font-weight="700" text-anchor="start" letter-spacing="1px" opacity="1">02</text><text x="125" y="607" fill="#17252B" font-family="Courier New, monospace" font-size="16px" font-weight="700" text-anchor="start" letter-spacing="0.8px" opacity="1">KEEP ACTIONS EXPLICIT</text><text x="125" y="637" fill="#68767A" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">Approval gates before email, publishing, or deployment.</text><line x1="70" y1="666" x2="805" y2="666" stroke="#C9C4B8" stroke-width="1"/><text x="70" y="699" fill="#B75034" font-family="Courier New, monospace" font-size="13px" font-weight="700" text-anchor="start" letter-spacing="1px" opacity="1">03</text><text x="125" y="699" fill="#17252B" font-family="Courier New, monospace" font-size="16px" font-weight="700" text-anchor="start" letter-spacing="0.8px" opacity="1">DESIGN FOR THE REAL USER</text><text x="125" y="729" fill="#68767A" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">Arabic-first flows, local constraints, and practical defaults.</text><line x1="70" y1="758" x2="805" y2="758" stroke="#C9C4B8" stroke-width="1"/><text x="70" y="791" fill="#B75034" font-family="Courier New, monospace" font-size="13px" font-weight="700" text-anchor="start" letter-spacing="1px" opacity="1">04</text><text x="125" y="791" fill="#17252B" font-family="Courier New, monospace" font-size="16px" font-weight="700" text-anchor="start" letter-spacing="0.8px" opacity="1">LEAVE A TRAIL</text><text x="125" y="821" fill="#68767A" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">Tests, manifests, source records, and honest limitations.</text><rect x="930" y="155" width="600" height="660" rx="2" fill="#17252B" stroke="#17252B" stroke-width="1"/><text x="980" y="210" fill="#D99D8B" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="start" letter-spacing="1.4px" opacity="1">BUILD MAP</text><text x="980" y="275" fill="#AEBDBD" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="start" letter-spacing="1px" opacity="1">FROM IDEA</text><text x="980" y="315" fill="#B75034" font-family="Georgia, Times New Roman, serif" font-size="34px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">→</text><text x="1030" y="313" fill="#F7F3EA" font-family="Georgia, Times New Roman, serif" font-size="19px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">brief / problem / constraint</text><text x="980" y="390" fill="#AEBDBD" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="start" letter-spacing="1px" opacity="1">TO SYSTEM</text><text x="980" y="430" fill="#B75034" font-family="Georgia, Times New Roman, serif" font-size="34px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">→</text><text x="1030" y="428" fill="#F7F3EA" font-family="Georgia, Times New Roman, serif" font-size="19px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">data / policy / interface</text><text x="980" y="505" fill="#AEBDBD" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="start" letter-spacing="1px" opacity="1">TO PROOF</text><text x="980" y="545" fill="#B75034" font-family="Georgia, Times New Roman, serif" font-size="34px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">→</text><text x="1030" y="543" fill="#F7F3EA" font-family="Georgia, Times New Roman, serif" font-size="19px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">tests / smoke check / review</text><line x1="980" y1="620" x2="1480" y2="620" stroke="#496064" stroke-width="1"/><text x="980" y="680" fill="#F7F3EA" font-family="Georgia, Times New Roman, serif" font-size="22px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">No cloud dependency by default.</text><text x="980" y="719" fill="#F7F3EA" font-family="Georgia, Times New Roman, serif" font-size="22px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">No silent external side effects.</text><text x="980" y="758" fill="#F7F3EA" font-family="Georgia, Times New Roman, serif" font-size="22px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">No claims without a visible trail.</text><line x1="70" y1="930" x2="1530" y2="930" stroke="#C9C4B8" stroke-width="1"/><text x="70" y="962" fill="#68767A" font-family="Courier New, monospace" font-size="11px" font-weight="700" text-anchor="start" letter-spacing="0.8px" opacity="1">MOHAMMAD J. BAKR  ·  2026</text><text x="1530" y="962" fill="#68767A" font-family="Courier New, monospace" font-size="11px" font-weight="700" text-anchor="end" letter-spacing="0.8px" opacity="1">02 / 09</text></svg>