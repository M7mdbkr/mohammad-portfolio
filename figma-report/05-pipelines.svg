<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#F4F0E8"/><text x="70" y="60" fill="#17252B" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="start" letter-spacing="1.5px" opacity="1">MJB / PORTFOLIO REPORT</text><text x="1530" y="60" fill="#68767A" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="end" letter-spacing="1.2px" opacity="1">05  ·  AUTOMATION + DATA</text><line x1="70" y1="82" x2="1530" y2="82" stroke="#C9C4B8" stroke-width="1"/><text x="70" y="155" fill="#B75034" font-family="Courier New, monospace" font-size="13px" font-weight="700" text-anchor="start" letter-spacing="1.4px" opacity="1">03 / AUTOMATION + DATA</text><text x="70" y="225" fill="#17252B" font-family="Georgia, Times New Roman, serif" font-size="60px" font-weight="400" text-anchor="start" letter-spacing="-2px" opacity="1">Pipelines that move</text><text x="70" y="283" fill="#B75034" font-family="Georgia, Times New Roman, serif" font-size="60px" font-weight="400" text-anchor="start" letter-spacing="-2px" opacity="1">from signal to useful output.</text><rect x="70" y="355" width="700" height="435" rx="12" fill="#FBFAF6" stroke="#C9C4B8" stroke-width="1"/><text x="105" y="405" fill="#176D78" font-family="Courier New, monospace" font-size="13px" font-weight="700" text-anchor="start" letter-spacing="1.2px" opacity="1">ARABIC NEWS BOT</text><text x="105" y="450" fill="#17252B" font-family="Georgia, Times New Roman, serif" font-size="30px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">RSS → Arabic → Telegram</text><text x="105" y="515" fill="#68767A" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">Cars and technology feeds become</text><text x="105" y="544" fill="#68767A" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">deduplicated stories, Arabic headlines,</text><text x="105" y="573" fill="#68767A" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">owner-only commands, and weekly</text><text x="105" y="602" fill="#68767A" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">reports plus ready-to-edit video scripts.</text><rect x="105" y="665" width="145" height="70" rx="8" fill="#E6F0EF" stroke="#A5C8C7" stroke-width="1"/><text x="120" y="690" fill="#B75034" font-family="Courier New, monospace" font-size="11px" font-weight="700" text-anchor="start" letter-spacing="0px" opacity="1">01</text><text x="120" y="712" fill="#17252B" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="start" letter-spacing="0px" opacity="1">FETCH</text><text x="120" y="729" fill="#68767A" font-family="Arial, Helvetica, sans-serif" font-size="10px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">RSS / Atom</text><rect x="265" y="665" width="145" height="70" rx="8" fill="#E6F0EF" stroke="#A5C8C7" stroke-width="1"/><text x="280" y="690" fill="#B75034" font-family="Courier New, monospace" font-size="11px" font-weight="700" text-anchor="start" letter-spacing="0px" opacity="1">02</text><text x="280" y="712" fill="#17252B" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="start" letter-spacing="0px" opacity="1">NORMALIZE</text><text x="280" y="729" fill="#68767A" font-family="Arial, Helvetica, sans-serif" font-size="10px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">clean + translate</text><rect x="425" y="665" width="145" height="70" rx="8" fill="#E6F0EF" stroke="#A5C8C7" stroke-width="1"/><text x="440" y="690" fill="#B75034" font-family="Courier New, monospace" font-size="11px" font-weight="700" text-anchor="start" letter-spacing="0px" opacity="1">03</text><text x="440" y="712" fill="#17252B" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="start" letter-spacing="0px" opacity="1">STORE</text><text x="440" y="729" fill="#68767A" font-family="Arial, Helvetica, sans-serif" font-size="10px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">SQLite dedup</text><rect x="585" y="665" width="145" height="70" rx="8" fill="#E6F0EF" stroke="#A5C8C7" stroke-width="1"/><text x="600" y="690" fill="#B75034" font-family="Courier New, monospace" font-size="11px" font-weight="700" text-anchor="start" letter-spacing="0px" opacity="1">04</text><text x="600" y="712" fill="#17252B" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="start" letter-spacing="0px" opacity="1">PUBLISH</text><text x="600" y="729" fill="#68767A" font-family="Arial, Helvetica, sans-serif" font-size="10px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">Telegram gate</text><rect x="830" y="355" width="700" height="435" rx="12" fill="#17252B" stroke="#17252B" stroke-width="1"/><text x="865" y="405" fill="#D99D8B" font-family="Courier New, monospace" font-size="13px" font-weight="700" text-anchor="start" letter-spacing="1.2px" opacity="1">CRYPTO SIGNAL ANALYZER</text><text x="865" y="450" fill="#F7F3EA" font-family="Georgia, Times New Roman, serif" font-size="30px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">Data, with the caveat attached.</text><text x="865" y="515" fill="#C7D2D1" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">CoinGecko market data becomes</text><text x="865" y="544" fill="#C7D2D1" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">explainable indicators: annualized</text><text x="865" y="573" fill="#C7D2D1" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">volatility, drawdown, market-cap rank,</text><text x="865" y="602" fill="#C7D2D1" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">and recent momentum.</text><rect x="865" y="665" width="290" height="70" rx="8" fill="#20383D" stroke="#557277" stroke-width="1"/><text x="890" y="695" fill="#D99D8B" font-family="Courier New, monospace" font-size="11px" font-weight="700" text-anchor="start" letter-spacing="0px" opacity="1">RISK</text><text x="890" y="720" fill="#F7F3EA" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">volatility + drawdown + rank</text><rect x="1170" y="665" width="320" height="70" rx="8" fill="#20383D" stroke="#557277" stroke-width="1"/><text x="1195" y="695" fill="#D99D8B" font-family="Courier New, monospace" font-size="11px" font-weight="700" text-anchor="start" letter-spacing="0px" opacity="1">MOMENTUM</text><text x="1195" y="720" fill="#F7F3EA" font-family="Arial, Helvetica, sans-serif" font-size="13px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">7d + 30d performance</text><text x="70" y="850" fill="#68767A" font-family="Georgia, Times New Roman, serif" font-size="19px" font-weight="400" text-anchor="start" letter-spacing="0px" opacity="1">The point is not “AI magic.” It is a chain a teammate can inspect, run, and improve.</text><text x="1530" y="850" fill="#176D78" font-family="Courier New, monospace" font-size="12px" font-weight="700" text-anchor="end" letter-spacing="1px" opacity="1">PYTHON  ·  RSS  ·  SQLITE  ·  TELEGRAM  ·  HTTP APIs</text><line x1="70" y1="930" x2="1530" y2="930" stroke="#C9C4B8" stroke-width="1"/><text x="70" y="962" fill="#68767A" font-family="Courier New, monospace" font-size="11px" font-weight="700" text-anchor="start" letter-spacing="0.8px" opacity="1">ARABIC NEWS BOT  ·  CRYPTO SIGNAL ANALYZER  ·  EXPLAINABLE PIPELINES</text><text x="1530" y="962" fill="#68767A" font-family="Courier New, monospace" font-size="11px" font-weight="700" text-anchor="end" letter-spacing="0.8px" opacity="1">05 / 09</text></svg>